name: CI

on:
  pull_request:
  push:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run checks
        run: mise run check
