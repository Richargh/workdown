name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  check-and-build:
    name: Check and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run checks
        run: mise run check

      - name: Check if VERSION changed
        id: version-change
        run: |
          if [ "$GITHUB_REF_NAME" = "trunk" ] && git diff --name-only HEAD^ HEAD | grep -qx VERSION; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release snapshot
        if: steps.version-change.outputs.changed != 'true'
        run: mise exec -- goreleaser release --snapshot --clean

      - name: Read version
        if: steps.version-change.outputs.changed == 'true'
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version-change.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Release tagged version
        if: steps.version-change.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_notes="$RUNNER_TEMP/release-notes.md"
          mise exec -- go run ./internal/tools/releaseprep --notes-for "${{ steps.version.outputs.version }}" --output "$release_notes"
          mise exec -- goreleaser release --clean --release-notes "$release_notes"
